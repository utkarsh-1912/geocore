name: Build & Release GeoCore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  # Never publish installers from a commit whose tests, frontend build or site build fail.
  checks:
    name: Checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Manual runs (workflow_dispatch) are checked against the tag typed into the form.
      - name: Compare tag with package.json, main.py and diagnostics.py
        run: python .github/scripts/check_version.py "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"

  build-release:
    name: Build (${{ matrix.os }})
    needs: [checks, verify-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      # Linux-only: build-essential/cmake for the llama-cpp-python sdist fallback below,
      # plus fakeroot/dpkg for electron-builder's .deb target (usually preinstalled, but
      # pinned explicitly so the job does not depend on ubuntu-latest's current image).
      - name: Install Linux Build Tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake fakeroot dpkg

      # Install the local LLM runtime first from the prebuilt CPU wheel index so
      # requirements.txt does not trigger a slow/fragile source build of llama.cpp.
      - name: Install Local LLM Runtime (llama-cpp-python, CPU wheel)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          WHEEL_INDEX=https://abetlen.github.io/llama-cpp-python/whl/cpu
          if [ "${{ matrix.platform }}" = "win" ]; then
            pip install llama-cpp-python --only-binary=llama-cpp-python --prefer-binary \
              --no-cache-dir --extra-index-url "$WHEEL_INDEX"
          else
            # The prebuilt macOS/Linux wheels have shipped corrupt before (BadZipFile:
            # Bad CRC-32 in libggml-base.dylib/.so). Try it uncached; otherwise build from
            # the PyPI sdist (slower, but reliable).
            pip install llama-cpp-python --only-binary=llama-cpp-python --prefer-binary \
              --no-cache-dir --extra-index-url "$WHEEL_INDEX" \
            || pip install llama-cpp-python --no-binary=llama-cpp-python --no-cache-dir
          fi

      - name: Install Python Dependencies & PyInstaller
        run: |
          cd python-backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Local LLM Runtime Imports
        run: python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"

      - name: Freeze Python Backend with PyInstaller
        run: |
          cd python-backend
          pyinstaller --clean main.spec

      # Start the frozen backend and require a ready engine with registered functions and GeoAI
      # tools. Catches missing hidden imports / native libraries before they reach users.
      - name: Smoke-test Frozen Backend
        shell: bash
        run: |
          BIN=python-backend/dist/main/main
          if [ "${{ matrix.platform }}" = "win" ]; then BIN="$BIN.exe"; fi
          python python-backend/smoke_test_frozen.py "$BIN" --timeout 240

      - name: Ad-hoc Sign Python Binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - python-backend/dist/main/main || codesign --force --deep --sign - python-backend/dist/main || true

      - name: Install Electron Dependencies
        run: |
          cd electron-app
          npm ci

      - name: Build & Package Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron-app
          npm run dist

      - name: Automatically Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Same expression as verify-version: a manual run from a branch must not publish a release
          # tagged with the branch name (e.g. "main"), which electron-updater cannot read as a version.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: "GeoCore ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          # NSIS installer, macOS dmg/zip, Linux AppImage + deb. latest*.yml + *.blockmap
          # are required by electron-updater for in-app auto-updates (deb has no
          # auto-update support in electron-updater; AppImage does).
          files: |
            electron-app/release/*.exe
            electron-app/release/*.dmg
            electron-app/release/*.zip
            electron-app/release/*.AppImage
            electron-app/release/*.deb
            electron-app/release/*.blockmap
            electron-app/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

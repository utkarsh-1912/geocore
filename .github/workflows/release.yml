name: Build & Release GeoCore

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Python Dependencies & PyInstaller
        run: |
          cd python-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Freeze Python Backend with PyInstaller
        run: |
          cd python-backend
          pyinstaller --clean main.spec

      - name: Ad-hoc Sign Python Binary (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - python-backend/dist/main/main || codesign --force --deep --sign - python-backend/dist/main || true

      - name: Install Electron Dependencies
        run: |
          cd electron-app
          npm ci

      - name: Build & Package Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron-app
          npm run dist

      - name: Automatically Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: "GeoCore ${{ github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            electron-app/release/*.exe
            electron-app/release/*.dmg
            electron-app/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

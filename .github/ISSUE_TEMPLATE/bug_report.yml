name: Bug report
description: A calculator, GeoAI or the app does not behave as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, use the Security tab instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: GeoCore version
      description: Shown on the home screen and in System Health.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux (AppImage), Linux (.deb), Built from source]
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Calculator or feature
      placeholder: e.g. IS 6403 Bearing Capacity, GeoAI chat, Import AGS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and inputs
      description: The inputs you entered (with units) and what you clicked. Attach a small sample file if one is involved; remove confidential project data first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: For a wrong number, say where the expected value comes from (hand calculation, standard, paper, other software).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The result or error message. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      render: text

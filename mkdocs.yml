site_name: GeoCore Documentation Portal
site_url: https://utkarsh-1912.github.io/geocore/
site_author: Utkarsh Gupta
site_description: Official Documentation for GeoCore - Advanced Geotechnical Engineering Application.
site_dir: website/docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: green
      accent: emerald
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: emerald
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

nav:
  - Getting Started: index.md
  - Geotechnical Modules:
      - Deep Foundations: modules/deep-foundations.md
      - Eurocode 7 Standards: modules/eurocode7.md
      - Site Investigation & CPT: modules/site-investigation.md
      - Shallow Foundations: modules/shallow-foundations.md
      - AGS File Converter: modules/ags-converter.md
  - Developer & Release Guides:
      - Architecture Overview: developer/architecture.md
      - Packaging & Executables: developer/packaging.md

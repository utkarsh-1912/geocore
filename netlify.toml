# Netlify Configuration for GeoCore Marketing Website & Documentation Portal
[build]
  publish = "website"
  command = "pip install mkdocs mkdocs-material && mkdocs build -d website/docs"

[build.environment]
  PYTHON_VERSION = "3.11"

# Production context
[context.production.environment]
  SITE_URL = "https://geocore.app"

# Clean routing and Docs redirects
[[redirects]]
  from = "/docs"
  to = "/docs/index.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache immutable assets (images, fonts, scripts)
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
